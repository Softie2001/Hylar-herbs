<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hylar Herbs — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--brand:#1E8E3E;--deep:#0A3D18;--bg:#F5F7F3;--surface:#fff;--ink:#12180F;--sub:#5B6559;--line:#E4E8E1;--danger:#C62828;--sale:#D91C4E}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}.hidden{display:none!important}.top{background:var(--deep);color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}.top h1{margin:0;font-size:20px}.top button,.btn{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:700}.top button{background:#fff;color:var(--deep)}.wrap{max-width:1200px;margin:auto;padding:24px 18px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 4px 16px rgba(0,0,0,.05)}.login{max-width:430px;margin:70px auto}.field{margin-bottom:14px}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:#fff}.field textarea{min-height:100px;resize:vertical}.btn-primary{background:var(--brand);color:#fff}.btn-danger{background:var(--danger);color:#fff}.btn-light{background:#eef3ea;color:var(--deep)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}.toolbar input{padding:11px 13px;border:1px solid var(--line);border-radius:9px;min-width:240px}.table-wrap{overflow:auto}.products{width:100%;border-collapse:collapse;min-width:780px}.products th,.products td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.products th{font-size:12px;color:var(--sub)}.thumb{width:54px;height:54px;border-radius:8px;object-fit:cover;background:#eee}.price del{color:var(--sub);font-size:12px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}.stock{background:#e7f5ea;color:#17652b}.out{background:#eee;color:#555}.sale{background:#ffe7ed;color:var(--sale)}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{border:0;border-radius:7px;padding:7px 9px;cursor:pointer;font-size:12px;font-weight:700}.modal{position:fixed;inset:0;background:rgba(0,0,0,.48);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.modal-card{background:#fff;border-radius:14px;width:min(680px,100%);max-height:92vh;overflow:auto;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head button{border:0;background:#eee;border-radius:8px;width:36px;height:36px;font-size:22px;cursor:pointer}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.image-preview{width:90px;height:90px;object-fit:cover;border-radius:10px;border:1px solid var(--line);margin-top:8px}.notice{padding:10px 12px;border-radius:8px;background:#eef3ea;margin-bottom:14px;font-size:13px}.error{background:#ffeded;color:#9b1c1c}.empty{text-align:center;padding:40px;color:var(--sub)}@media(max-width:650px){.grid2{grid-template-columns:1fr}.full{grid-column:auto}.toolbar input{min-width:100%;width:100%}}
</style>
</head>
<body>
<div id="loginView" class="wrap"><div class="panel login"><h2>Hylar Herbs Admin</h2><p style="color:var(--sub)">Sign in to manage products, prices, sales and stock.</p><div id="loginMsg"></div><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn btn-primary" style="width:100%">Sign in</button></form></div></div>
<div id="appView" class="hidden"><header class="top"><h1>Hylar Herbs — Product Admin</h1><button id="logout">Log out</button></header><main class="wrap"><div id="msg"></div><div class="panel"><div class="toolbar"><div><h2 style="margin:0 0 4px">Products</h2><small style="color:var(--sub)">Changes here update the customer shop.</small></div><div style="display:flex;gap:8px;flex-wrap:wrap"><input id="search" placeholder="Search products…"><button class="btn btn-primary" id="addProduct">+ Add product</button></div></div><div class="table-wrap"><table class="products"><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Visible</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div></main></div>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle" style="margin:0">Add product</h2><button id="closeModal" type="button">×</button></div><form id="productForm"><input id="pid" type="hidden"><div class="grid2"><div class="field"><label>Product name</label><input id="pname" required></div><div class="field"><label>Category</label><select id="pcat"><option value="feminine">Feminine Wellness</option><option value="ttc">Fertility &amp; TTC</option><option value="infection">Infection Care</option><option value="men">Men's Vitality</option><option value="body">Body &amp; Weight</option></select></div><div class="field"><label>Regular / initial price (₦)</label><input id="regular" type="number" min="0" step="0.01" required></div><div class="field"><label>Sale price (₦) — leave empty for no sale</label><input id="sale" type="number" min="0" step="0.01"></div><div class="field full"><label>Description</label><textarea id="desc"></textarea></div><div class="field"><label>Tag</label><select id="tag"><option value="">None</option><option value="Kit">Kit</option></select></div><div class="field"><label>Sort order</label><input id="sort" type="number" min="0" step="1" value="999"></div><div class="field"><label><input id="stock" type="checkbox" checked> In stock</label><label><input id="visible" type="checkbox" checked> Visible on shop</label><label><input id="best" type="checkbox"> Best seller</label></div><div class="field"><label>Product image</label><input id="image" type="file" accept="image/*"><div id="previewWrap"></div><small style="color:var(--sub)">Existing GitHub image URLs can be kept. New uploads go to Supabase Storage.</small></div></div><div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn btn-light" type="button" id="cancel">Cancel</button><button class="btn btn-primary" type="submit">Save product</button></div></form></div></div>
<script>
const SUPABASE_URL='https://wstpvrhjhscctekwbkcs.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_XHxPBPuaGr1uMRZ8LwC8qw_Odhi8hMP';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let allProducts=[];
const $=id=>document.getElementById(id);
function msg(text,error=false){$('msg').innerHTML=text?`<div class="notice ${error?'error':''}">${text}</div>`:''}
function loginMsg(text,error=false){$('loginMsg').innerHTML=text?`<div class="notice ${error?'error':''}">${text}</div>`:''}
function money(n){return '₦'+Number(n||0).toLocaleString('en-NG')}
function imageUrl(v){if(!v)return ''; if(v.startsWith('http')||v.startsWith('data:')||v.startsWith('/'))return v; return v}
async function ensureAdmin(){const {data:{user}}=await sb.auth.getUser(); if(!user)return false; const {data,error}=await sb.from('admins').select('user_id').eq('user_id',user.id).maybeSingle(); if(error||!data){await sb.auth.signOut();return false} return true}
async function showApp(){if(await ensureAdmin()){$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');await loadProducts()}else{$('loginView').classList.remove('hidden');$('appView').classList.add('hidden')}}
async function loadProducts(){const {data,error}=await sb.from('products').select('*').order('sort_order',{ascending:true}).order('created_at',{ascending:true}); if(error){msg(error.message,true);return} allProducts=data||[];render()}
function render(){const q=$('search').value.trim().toLowerCase();const list=allProducts.filter(p=>`${p.name} ${p.description||''} ${p.category||''}`.toLowerCase().includes(q));$('rows').innerHTML=list.length?list.map(p=>{const sale=p.sale_price!=null&&Number(p.sale_price)>0;const img=imageUrl(p.image_url);return `<tr><td><div style="display:flex;align-items:center;gap:10px">${img?`<img class="thumb" src="${img}" alt="">`:''}<div><strong>${esc(p.name)}</strong><br><small style="color:var(--sub)">${esc(p.tag||'')}</small></div></div></td><td>${esc(p.category)}</td><td class="price">${sale?`<del>${money(p.regular_price)}</del><br><strong style="color:var(--sale)">${money(p.sale_price)}</strong>`:money(p.regular_price)}</td><td><span class="badge ${p.in_stock?'stock':'out'}">${p.in_stock?'In Stock':'Out of Stock'}</span></td><td>${p.visible?'Yes':'No'}</td><td><div class="actions"><button class="btn-light" onclick="editProduct('${p.id}')">Edit</button><button class="btn-light" onclick="toggleStock('${p.id}',${!p.in_stock})">${p.in_stock?'Out of stock':'In stock'}</button><button class="btn-light" onclick="toggleVisible('${p.id}',${!p.visible})">${p.visible?'Hide':'Show'}</button><button style="background:#ffeded;color:#9b1c1c" onclick="deleteProduct('${p.id}')">Delete</button></div></td></tr>`}).join(''):'<tr><td colspan="6" class="empty">No products found.</td></tr>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openModal(p=null){$('modal').classList.remove('hidden');$('modalTitle').textContent=p?'Edit product':'Add product';$('pid').value=p?.id||'';$('pname').value=p?.name||'';$('pcat').value=p?.category||'body';$('regular').value=p?.regular_price??'';$('sale').value=p?.sale_price??'';$('desc').value=p?.description||'';$('tag').value=p?.tag||'';$('sort').value=p?.sort_order??999;$('stock').checked=p?.in_stock!==false;$('visible').checked=p?.visible!==false;$('best').checked=!!p?.best_seller;$('image').value='';$('previewWrap').innerHTML=p?.image_url?`<img class="image-preview" src="${imageUrl(p.image_url)}" alt="">`:''}
function closeModal(){$('modal').classList.add('hidden')}
window.editProduct=id=>openModal(allProducts.find(p=>p.id===id));
window.toggleStock=async(id,v)=>{const {error}=await sb.from('products').update({in_stock:v,updated_at:new Date().toISOString()}).eq('id',id);if(error)msg(error.message,true);else await loadProducts()};
window.toggleVisible=async(id,v)=>{const {error}=await sb.from('products').update({visible:v,updated_at:new Date().toISOString()}).eq('id',id);if(error)msg(error.message,true);else await loadProducts()};
window.deleteProduct=async id=>{const p=allProducts.find(x=>x.id===id);if(!confirm(`Delete ${p?.name||'this product'}? This cannot be undone.`))return;const {error}=await sb.from('products').delete().eq('id',id);if(error)msg(error.message,true);else await loadProducts()};
async function uploadImage(file){const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');const path=`${crypto.randomUUID()}.${ext}`;const {error}=await sb.storage.from('product-images').upload(path,file,{upsert:false,contentType:file.type});if(error)throw error;const {data}=sb.storage.from('product-images').getPublicUrl(path);return data.publicUrl}
$('productForm').addEventListener('submit',async e=>{e.preventDefault();msg('');const id=$('pid').value||`p_${crypto.randomUUID()}`;let imageUrlValue=allProducts.find(p=>p.id===id)?.image_url||'';try{const file=$('image').files[0];if(file)imageUrlValue=await uploadImage(file);const regular=Number($('regular').value);const sale=$('sale').value.trim()===''?null:Number($('sale').value);if(sale!==null&&(sale<=0||sale>=regular)){msg('Sale price must be greater than 0 and lower than the regular price.',true);return}const payload={id,name:$('pname').value.trim(),description:$('desc').value.trim(),category:$('pcat').value,tag:$('tag').value,image_url:imageUrlValue,regular_price:regular,sale_price:sale,in_stock:$('stock').checked,visible:$('visible').checked,best_seller:$('best').checked,sort_order:Number($('sort').value)||999,updated_at:new Date().toISOString()};const {error}=await sb.from('products').upsert(payload,{onConflict:'id'});if(error)throw error;closeModal();await loadProducts();msg('Product saved successfully.')}catch(err){msg(err.message||'Could not save product.',true)}});
$('addProduct').onclick=()=>openModal();$('closeModal').onclick=closeModal;$('cancel').onclick=closeModal;$('search').oninput=render;$('logout').onclick=async()=>{await sb.auth.signOut();showApp()};$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});$('loginForm').addEventListener('submit',async e=>{e.preventDefault();loginMsg('Signing in…');const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){loginMsg(error.message,true);return}if(!(await ensureAdmin())){loginMsg('This account is not an approved Hylar Herbs administrator.',true);return}await showApp()});sb.auth.onAuthStateChange(()=>setTimeout(showApp,0));showApp();
</script>
</body></html>
